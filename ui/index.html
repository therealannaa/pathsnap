<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Evaluator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#5f6b7a; --line:#d9dde3; --accent:#1565c0; --pred:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; color:var(--text); background:var(--bg); display:flex; height:100vh; }
  aside { width:340px; padding:16px; background:var(--panel); border-right:1px solid var(--line); overflow:auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:12px; }
  label { display:block; margin:14px 0 4px; font-weight:600; }
  input { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; }
  .trips { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  button { padding:8px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  td { padding:4px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  #status { margin-top:10px; min-height:20px; }
  #map { flex:1; }
  .legend { background:#fff; padding:6px 8px; border-radius:4px; font-size:12px; box-shadow:0 1px 4px #0003; }
  .sw { display:inline-block; width:14px; height:4px; margin-right:6px; vertical-align:middle; }
  @media (max-width:700px) { body { flex-direction:column; } aside { width:100%; height:45vh; } }
</style>
</head>
<body>
<aside>
  <h1>PathSnap Evaluator</h1>
  <div class="muted">Pick a trip. The UI sends only the trip ID; the API on Laptop 1 runs the full pipeline and scores it against its own reference data.</div>
  <label for="api">API address (Laptop 1)</label>
  <input id="api" placeholder="http://192.168.x.x:8000">
  <button id="connect" style="margin-top:6px;width:100%">Load trips</button>
  <label>Evaluation trips</label>
  <div class="trips" id="trips"><span class="muted">Not loaded yet.</span></div>
  <div id="status" class="muted"></div>
  <label>Results</label>
  <table id="results"><tr><td class="muted" colspan="2">No trip run yet.</td></tr></table>
</aside>
<div id="map"></div>
<script>
const map = L.map('map').setView([20, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
const gpsLayer = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
L.control.layers(null, {'Raw GPS': gpsLayer, 'Predicted route': routeLayer}, {collapsed: false}).addTo(map);
const legend = L.control({position: 'bottomright'});
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = '<div><span class="sw" style="background:#1565c0"></span>Raw GPS</div><div><span class="sw" style="background:#c62828"></span>Predicted route</div>'; return d; };
legend.addTo(map);

const apiInput = document.getElementById('api'), statusEl = document.getElementById('status');
let saved = null; try { saved = localStorage.getItem('pathsnap_api'); } catch (e) {}
apiInput.value = saved || `http://${location.hostname || 'localhost'}:8000`;
const api = () => apiInput.value.replace(/\/$/, '');

async function loadTrips() {
  try { localStorage.setItem('pathsnap_api', apiInput.value); } catch (e) {}
  statusEl.textContent = 'Contacting API...';
  try {
    const r = await fetch(api() + '/trips'); const j = await r.json();
    const box = document.getElementById('trips'); box.innerHTML = '';
    j.trips.forEach(t => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => runTrip(t, b); box.appendChild(b); });
    statusEl.textContent = `${j.trips.length} trips available.`;
  } catch (e) { statusEl.textContent = 'Could not reach the API: ' + e; }
}

const pct = v => (v === undefined || v === null) ? 'n/a' : (100 * v).toFixed(2) + ' %';
async function runTrip(tid, btn) {
  document.querySelectorAll('.trips button').forEach(b => b.classList.remove('active')); btn.classList.add('active');
  statusEl.textContent = `Running trip ${tid}...`; const t0 = performance.now();
  try {
    const r = await fetch(api() + '/predict', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({trip_id: tid})});
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    gpsLayer.clearLayers(); routeLayer.clearLayers();
    const step = Math.max(1, Math.floor(j.gps.length / 3000));
    j.gps.filter((_, i) => i % step === 0).forEach(p => L.circleMarker(p, {radius: 2, color: '#1565c0', weight: 0, fillOpacity: .8}).addTo(gpsLayer));
    j.predicted_route.forEach(line => L.polyline(line, {color: '#c62828', weight: 4, opacity: .85}).addTo(routeLayer));
    map.fitBounds(L.latLngBounds(j.gps));
    const e = j.evaluation;
    const rows = [['Trip', j.trip_id], ['GPS points', j.n_points],
      ['Point accuracy (classifier + HMM)', pct(e.point_accuracy_hmm)], ['Point accuracy (classifier only)', pct(e.point_accuracy_classifier_only)],
      ['Route precision', pct(e.route_precision)], ['Route recall', pct(e.route_recall)], ['Route F1', pct(e.route_f1)],
      ['Route continuity', pct(j.route_continuity)], ['HMM breaks', j.hmm_breaks],
      ['API time (s)', (j.timing_s.features + j.timing_s.inference + j.timing_s.scoring).toFixed(2)],
      ['Round trip (s)', ((performance.now() - t0) / 1000).toFixed(2)]];
    document.getElementById('results').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    statusEl.textContent = e.available ? 'Done.' : 'Done (no reference route on the server for this trip).';
  } catch (err) { statusEl.textContent = 'Request failed: ' + err; }
}
document.getElementById('connect').onclick = loadTrips;
</script>
</body>
</html>
